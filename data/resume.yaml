publications:
  - name: Writing Cross-Platform PowerShell
    publisher: SQL Saturday Atlanta 2025 - AI & BI
    releaseDate: "2025-03-08"
    summary: |
      Presenter

      Since its release in March 2020, PowerShell 7 has transformed the scripting landscape by introducing official cross-platform support for Windows, macOS, and most Linux distributions, significantly reducing the barrier to adoption for developers and IT professionals in diverse environments. In this session, we’ll explore how to write OS-agnostic PowerShell scripts that seamlessly support these platforms, including practical techniques for handling OS-specific differences with clean, maintainable code.

  - name: Writing Cross-Platform PowerShell
    publisher: The PowerShell + DevOps Global Summit 2024
    releaseDate: "2024-04"
    summary: |
      Presenter

      When released, PowerShell 7 became the first PowerShell version to officially support cross-platform installations, meaning that you can run PowerShell on Windows, MacOS, and most Linux distributions. In this session, we will learn how to write PowerShell code that supports these platforms so you can keep your code consistent and avoid maintaining multiple OS specific scripts.

  - name: "BluebirdPS: From Nesting to Hatched and Flying"
    publisher: The PowerShell + DevOps Global Summit 2023
    releaseDate: "2023-04"
    summary: |
      Presenter

      BluebirdPS is a PowerShell 7 hybrid manifest module for the Twitter REST API and includes a .NET assembly written in C# used primarily for output. In this session, we will examine certain aspects of BluebirdPS in-depth. We will look at the basic framework and structure of the module, as well as how it has evolved over the last two plus years, what original design choices survived and which did not.

  - name: Your Code is Flawless, But How YOU doing?
    publisher: The PowerShell + DevOps Global Summit 2023
    releaseDate: "2023-04"
    summary: |
      Co-presenter, with Andrew Pla

      A session on our individual paths of self discovery leading to healthier mental states and happier lives.

  - name: "Creating BluebirdPS: A PowerShell 7 Twitter Automation Client"
    publisher: The PowerShell + DevOps Global Summit 2021
    releaseDate: "2021-04-27"
    summary: |
      Video on Demand Presentation

      In this talk, we will examine the process used in creating BluebirdPS, a PowerShell 7 module for the Twitter REST API. Topics will include learning the API, authentication, module structure, response and error handling, and customizing the output.

  - name: The PowerShell Conference Book Volume 3
    publisher: Leanpub
    releaseDate: "2020-08"
    summary: |
      This book is designed to be like a conference in a book where each chapter is written by a different author who is a subject matter expert on the topic covered in their chapter.

      I provided a chapter entitled, "Exploring Experimental Features in PowerShell 7".

  - name: "#PS7Now"
    publisher: Leanpub
    releaseDate: "2020-03-26"
    summary: |
      A PowerShell community project highlighting new features in PowerShell 7 and why you should begin adopting it as your daily management tool. This ebook is an edited collection of articles published during a #PSBlogWeek event in March 2020 that focused on the release of PowerShell 7. The articles are written by members of the PowerShell community excited about everything that PowerShell 7 has to offer.

      I contributed two articles for PSBlogWeek PS7Now: "PowerShell 7 Changes to JSON Cmdlets" and "PowerShell 7 Experimental Features".

  - name: The PowerShell Conference Book Volume 2
    publisher: Leanpub
    releaseDate: "2020-01-31"
    summary: |
      This book is designed to be like a conference in a book where each chapter is written by a different author who is a subject matter expert on the topic covered in their chapter.

      I provided a chapter on the cultural shift to DevOps entitled, "On the Road to DevOps, Don’t Forget the Soft Skills".

  - name: "Crossing the Divide: A System Administrator's Path to DevOps"
    publisher: Research Triangle PowerShell User Group - PowerShell Saturday
    releaseDate: "2019-09-21"
    summary: |
      Presenter

      An examination of one systems administrator’s journey to see how they acquired some of the prerequisite skill sets and changed their mindset on the continuous path to DevOps methodology integration.

