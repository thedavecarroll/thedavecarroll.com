baseurl: https://thedavecarroll.com/
locale: en-us
theme: techjournal
title: Dave's Technical Journal
copyright: Dave Carroll

enableRobotsTXT: true

pagination:
    pagerSize: 10

params:
    githubUsername: thedavecarroll
    description: "Dave Carroll's technical journal: PowerShell scripting, module design and automation, retrocomputing, and lessons from over 30 years in IT."

    # Author information
    author:
        name: Dave Carroll
        bio: |
            PowerShell,
            general IT, and
            retrocomputing
        avatar: images/thedavecarroll-avatar-transparent.png

    # Social links
    social:
        github: thedavecarroll
        linkedin: thedavecarroll
        bluesky: thedavecarroll.com

    # License
    license:
        name: CC BY-NC-SA 4.0
        url: https://creativecommons.org/licenses/by-nc-sa/4.0/

    mainSections:
        - powershell
        - blog

    footer:
        since: 2018

    article:
        license:
            enabled: true
            source: Originally published at
            default: This article is licensed under

    comments:
        enabled: true
        giscus:
            repo: thedavecarroll/thedavecarroll.com
            repoId: R_kgDOGcQm8w
            category: Site Comments
            categoryId: DIC_kwDOGcQm884CRFma
            mapping: pathname
            strict: 1
            reactionsEnabled: 1
            emitMetadata: 0
            inputPosition: "bottom"
            lang: "en"

    defaultImage:
        opengraph:
            enabled: true
            local: true
            src: /images/grid.png

    colorScheme:
        # Available values: auto, light, dark
        default: auto

# YAML as an output format, used by the résumé page (/resume/index.yaml)
outputFormats:
    yaml:
        mediaType: application/yaml
        baseName: index
        isPlainText: true

### Menu items are defined in content front matter.
### To change them, edit the `menu` field in content files.

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
